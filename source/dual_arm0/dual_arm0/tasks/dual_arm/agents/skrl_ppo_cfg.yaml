# 난수 생성을 위한 시드(Seed) 값입니다. 동일한 시드를 설정하여 학습 결과를 재현할 수 있습니다.
seed: 42

# 강화학습 모델(신경망) 구성 설정입니다. (skrl의 모델 인스턴스 유틸리티 사용)
models:
  # 정책(Policy) 신경망과 가치(Value) 신경망의 가중치를 완전히 분리할지 여부입니다.
  separate: False
  
  # 에이전트의 행동(Action)을 결정하는 정책(Policy) 신경망 설정입니다.
  policy:
    # 연속적인 행동 공간을 제어하기 위해 가우시안 분포(Gaussian distribution) 기반 모델을 사용합니다.
    class: GaussianMixin
    # 출력된 액션 값을 행동 공간 한계 내로 자동 클리핑(제한)할지 여부입니다.
    clip_actions: False
    # 탐색의 다양성을 조절하는 표준편차 로그(log_std)의 클리핑 활성화 여부입니다.
    clip_log_std: True
    # 표준편차 로그의 최솟값입니다. 탐색이 너무 축소되는 것을 방지합니다.
    min_log_std: -20.0
    # 표준편차 로그의 최댓값입니다. 탐색 범위가 너무 커져서 발산하는 것을 방지합니다.
    max_log_std: 2.0
    # 표준편차 로그의 초기값입니다.
    initial_log_std: 0.0
    # 실제 인공신경망 계층(Architecture) 설정입니다.
    network:
      - name: net
        # 입력으로 환경의 상태 관측값(STATES)을 받습니다.
        input: STATES
        # 은닉층(Hidden layers) 구조입니다. 복잡한 듀얼 암 태스크를 위해 용량을 대폭 확장했습니다.
        layers: [1024, 512, 256]
        # 은닉층에 적용할 활성화 함수(Activation function)입니다.
        activations: elu
    # 최종 출력은 에이전트가 실행할 행동(ACTIONS)입니다.
    output: ACTIONS
    
  # 현재 상태의 가치를 평가하는 가치(Value) 신경망 설정입니다.
  value:
    # 상태에 대한 예측 가치를 하나의 값으로 직접 출력하는 결정론적(Deterministic) 가치 신경망을 사용합니다.
    class: DeterministicMixin
    # 출력 액션 클리핑 여부 (가치 평가 망이므로 해당 사항 없음)
    clip_actions: False
    # 가치 신경망의 인공신경망 구조입니다. 정책 망과 동일한 대칭 구조를 사용합니다.
    network:
      - name: net
        input: STATES
        layers: [1024, 512, 256]
        activations: elu
    # 최종 출력은 1차원의 상태 가치 값(ONE)입니다.
    output: ONE

# 에피소드 진행 중에 수집한 데이터(상태, 액션, 보상 등)를 임시 보관할 메모리(버퍼) 설정입니다.
memory:
  # 무작위로 데이터를 추출하여 학습할 수 있는 표준 Random Memory 버퍼를 사용합니다.
  class: RandomMemory
  # 메모리 용량입니다. -1로 설정하면 에이전트 설정(rollouts 등)에 맞추어 자동으로 크기를 조절합니다.
  memory_size: -1

# PPO(Proximal Policy Optimization) 에이전트 하이퍼파라미터 설정입니다.
agent:
  # 사용할 강화학습 알고리즘으로 PPO를 지정합니다.
  class: PPO
  # 한 번의 학습 에포크 이전에 수집할 배치 단위당 롤아웃(Rollout) 수입니다.
  rollouts: 16
  # 수집된 데이터를 몇 차례 반복해서 학습(Update)에 사용할지 결정하는 에포크 수입니다.
  learning_epochs: 8
  # 에포크마다 전체 배치를 몇 개의 미니배치(Mini-batch)로 나누어 학습할지 지정합니다. (메모리 사용률 및 안정성에 관여)
  mini_batches: 4
  # 감쇠 인자(Discount factor, γ)입니다. 미래 보상을 얼마나 가치 평가할지 결정합니다. (1에 가까울수록 장기 보상 중시)
  discount_factor: 0.99
  # GAE(Generalized Advantage Estimation) 계산용 가중치 파라미터(λ)입니다. (분산을 줄이고 편향을 조절)
  lambda: 0.95
  # 학습률(Learning rate)입니다. 경사하강법을 통한 가중치 업데이트 속도를 제어합니다.
  learning_rate: 3.0e-4
  # 학습률 스케줄러를 적용합니다. KLAdaptiveRL은 정책 분포의 변화량(KL Divergence)에 맞춰 학습률을 동적으로 조정합니다.
  learning_rate_scheduler: KLAdaptiveLR
  # 학습률 스케줄러용 세부 변수 설정입니다.
  learning_rate_scheduler_kwargs:
    # 정책의 변화 기준점이 되는 KL Divergence 임계치입니다.
    kl_threshold: 0.008
  # 상태 관측값(State)을 학습망에 넣기 전 정규화하는 전처리기 클래스입니다. (실시간 평균/표준편차로 스케일링)
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  # 예측 가치(Value) 값을 정규화하는 전처리기 클래스입니다.
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  # 무작위 행동을 취할 초기 타임스텝 수입니다. 0이면 처음부터 정책망에 따른 학습을 진행합니다.
  random_timesteps: 0
  # 실제 학습을 시작할 시점의 타임스텝 수입니다.
  learning_starts: 0
  # 기울기 폭주를 막기 위한 그래디언트 클리핑(Gradient L2-Norm clipping) 한계값입니다.
  grad_norm_clip: 1.0
  # PPO 정책 비율(Ratio)의 클리핑 한계값입니다. 구정책과 신정책 간의 급격한 변화를 0.8배 ~ 1.2배 사이로 제한합니다.
  ratio_clip: 0.2
  # 가치 함수 업데이트 시 가치 값의 급격한 변화를 제어할 클리핑 범위입니다.
  value_clip: 0.2
  # 예측된 가치 값에 클리핑을 적용할지 여부입니다.
  clip_predicted_values: True
  # 엔트로피 손실 함수(Entropy loss) 가중치입니다. 높은 탐색(Exploration)을 유도하려면 값을 늘리며, 0은 미적용입니다.
  entropy_loss_scale: 0.0
  # 가치 오차 손실 함수 가중치입니다.
  value_loss_scale: 1.0
  # KL divergence 임계값 필터링용 변수입니다.
  kl_threshold: 0.0

  # 학습 진행 기록 및 체크포인트 설정입니다.
  experiment:
    # 로그 파일 및 Tensorboard 기록이 보존될 디렉토리 경로입니다.
    directory: "logs/skrl/Isaac-Dual-Arm-v0"
    # 하위 디렉토리 생성 시 추가할 실험 이름입니다.
    experiment_name: ""
    # Tensorboard 등에 로그 데이터를 작성할 주기(타임스텝 단위)입니다.
    write_interval: 120
    # 에이전트의 모델 가중치 체크포인트(.pt 파일)를 주기적으로 저장할 간격입니다.
    checkpoint_interval: 1200
    # Weights & Biases(Wandb) 연동 활성화 여부입니다.
    wandb: False
    # Wandb 연동 시 사용할 프로젝트 정보입니다.
    wandb_kwargs:
      project: "isaaclab"
      name: "Isaac-Dual-Arm-v0"

# 학습 루프 제어기(Trainer) 설정입니다.
trainer:
  # 타임스텝별로 순차적으로 루프를 실행시키는 Sequential Trainer 클래스를 지정합니다.
  class: SequentialTrainer
  # 에이전트가 환경에서 수행할 총 누적 시뮬레이션 타임스텝 수입니다.
  timesteps: 1000000
  # 환경 정보를 콘솔 및 로그에 어떤 레벨로 기록할지 설정합니다.
  environment_info: log
